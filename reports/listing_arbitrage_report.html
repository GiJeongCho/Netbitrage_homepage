<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />

<title>무위험 차익거래 · 실시간 포워드 백테스트 리포트 — Netbitrage</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2233; --panel2: #212c42; --line: #2c3a56;
    --txt: #e6ecf7; --muted: #93a2c0; --pos: #38d39f; --neg: #ff6b81; --accent: #5b9dff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt);
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .method { color: var(--muted); font-size: 12px; margin-bottom: 20px; padding: 6px 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: inline-block; }
  .toggle { display: inline-flex; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; margin-bottom: 22px; }
  .toggle button { background: transparent; color: var(--muted); border: 0; padding: 9px 16px;
    font-size: 13px; cursor: pointer; }
  .toggle button.active { background: var(--accent); color: #fff; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 700; }
  .value.pos { color: var(--pos); } .value.neg { color: var(--neg); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 24px; }
  .panel h2 { font-size: 15px; margin: 0 0 14px; }
  canvas { max-height: 320px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-weight: 600; }
  tbody tr:hover { background: var(--panel2); }
  .warn { background: #2a1a22; border: 1px solid #5a2b39; color: #ffb3c0; }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 30px; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
</style>
</head>
<body>
<div class="wrap">
  <h1>무위험 차익거래 · 실시간 포워드 백테스트 리포트</h1>
  <div class="sub" id="sub"></div>
  <div class="method" id="method">실시간 시세(업비트·바이낸스 라이브 호가) 기반 포워드 백테스트 · 델타중립 1:10 헤지 · 슬리피지/수수료 미반영</div>

  <div class="toggle">
    <button id="btn-all" class="active" onclick="setVariant('all')">전체</button>
    <button id="btn-clean" onclick="setVariant('clean')">헤지 깨진 거래 제외</button>
  </div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>주별 손익 (KRW)</h2>
    <canvas id="weeklyChart"></canvas>
  </div>

  <div class="panel">
    <h2>주별 상세</h2>
    <table id="weeklyTable">
      <thead><tr><th>구간</th><th>청산</th><th>TP</th><th>SL</th><th>손익(KRW)</th><th>복리수익률</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="panel" id="brokenPanel"></div>

  <div class="foot" id="foot"></div>
</div>

<script>

555}, {"bucket": "2026-08-15", "n_exit": 5, "TP": 4, "SL": 1, "cum_pnl_krw": 5200.24713518806, "return_pct": 4.793159625217958}, {"bucket": "2026-08-16", "n_exit": 1, "TP": 1, "SL": 0, "cum_pnl_krw": 1696.7054263565883, "return_pct": 1.5424594785059975}, {"bucket": "2026-08-17", "n_exit": 5, "TP": 5, "SL": 0, "cum_pnl_krw": 5313.715090722879, "return_pct": 4.910599074524291}, {"bucket": "2026-08-18", "n_exit": 3, "TP": 3, "SL": 0, "cum_pnl_krw": 4993.528370844317, "return_pct": 4.608609500303862}, {"bucket": "2026-08-19", "n_exit": 7, "TP": 7, "SL": 0, "cum_pnl_krw": 10024.378661109431, "return_pct": 9.46447936586392}, {"bucket": "2026-08-20", "n_exit": 8, "TP": 5, "SL": 3, "cum_pnl_krw": 5348.744554807818, "return_pct": 4.861257533730079}, {"bucket": "2026-08-21", "n_exit": 53, "TP": 40, "SL": 13, "cum_pnl_krw": 8564.07808476486, "return_pct": 6.002653937754032}, {"bucket": "2026-08-22", "n_exit": 111, "TP": 69, "SL": 42, "cum_pnl_krw": 23399.834868841164, "return_pct": 17.43326819792137}, {"bucket": "2026-08-23", "n_exit": 16, "TP": 14, "SL": 2, "cum_pnl_krw": 9995.437674909705, "return_pct": 9.40352524484489}, {"bucket": "2026-08-24", "n_exit": 14, "TP": 13, "SL": 1, "cum_pnl_krw": 12576.565931047871, "return_pct": 11.974040842088996}, {"bucket": "2026-08-25", "n_exit": 11, "TP": 9, "SL": 2, "cum_pnl_krw": -3172.4343248016394, "return_pct": -2.9289913078596186}, {"bucket": "2026-08-26", "n_exit": 10, "TP": 9, "SL": 1, "cum_pnl_krw": 2231.9927573062873, "return_pct": 2.035207673187478}], "totals": {"n_exit": 265, "cum_pnl_krw": 106695.82615960497, "start_balance_krw": 110000.00000000001, "final_balance_krw": 267747.7491349352, "total_return_pct": 143.40704466812292, "n_tp": 196, "n_sl": 69}}}};
let current = 'all';
let chart = null;

const fmtKRW = (v) => Math.round(v).toLocaleString('ko-KR') + ' 원';
const fmtPct = (v) => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
const cls = (v) => v > 0 ? 'pos' : (v < 0 ? 'neg' : '');

function renderCards(t) {
  const cards = [
    { label: '청산 건수', value: t.n_exit.toLocaleString('ko-KR') + ' 건', cls: '' },
    { label: '누적 손익', value: fmtKRW(t.cum_pnl_krw), cls: cls(t.cum_pnl_krw) },
    { label: '최종 잔고 (복리)', value: fmtKRW(t.final_balance_krw), cls: '' },
    { label: '복리 수익률', value: fmtPct(t.total_return_pct), cls: cls(t.total_return_pct) },
    { label: 'TP / SL', value: t.n_tp + ' / ' + t.n_sl, cls: '' },
  ];
  document.getElementById('cards').innerHTML = cards.map(c =>
    `<div class="card"><div class="label">${c.label}</div><div class="value ${c.cls}">${c.value}</div></div>`
  ).join('');
}

function renderTable(weekly) {
  const rows = weekly.map(r => `<tr>
    <td>${r.bucket}</td><td>${r.n_exit}</td><td>${r.TP}</td><td>${r.SL}</td>
    <td class="${cls(r.cum_pnl_krw)}">${fmtKRW(r.cum_pnl_krw)}</td>
    <td class="${cls(r.return_pct)}">${fmtPct(r.return_pct)}</td>
  </tr>`).join('');
  document.querySelector('#weeklyTable tbody').innerHTML = rows;
}

function renderChart(weekly) {
  const labels = weekly.map(r => r.bucket);
  const vals = weekly.map(r => Math.round(r.cum_pnl_krw));
  const colors = vals.map(v => v >= 0 ? '#38d39f' : '#ff6b81');
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('weeklyChart'), {
    type: 'bar',
    data: { labels, datasets: [{ data: vals, backgroundColor: colors, borderRadius: 6 }] },
    options: {
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: (c) => fmtKRW(c.raw) } } },
      scales: {
        x: { ticks: { color: '#93a2c0' }, grid: { display: false } },
        y: { ticks: { color: '#93a2c0', callback: (v) => (v/10000)+'만' }, grid: { color: '#2c3a56' } }
      }
    }
  });
}

function renderBroken() {
  const b = DATA.broken;
  const el = document.getElementById('brokenPanel');
  if (!b.count) { el.style.display = 'none'; return; }
  el.className = 'panel warn';
  el.innerHTML = `<h2>⚠️ 헤지 깨진 거래 감지 (EDGE류)</h2>
    <div>양쪽 손익 부호가 같은(정상 델타중립이면 반대여야 함) 거래 <b>${b.count}건</b>,
    이들의 손익 합계 <b>${fmtKRW(b.pnl_krw)}</b>.
    티커만 같고 실제론 다른 코인이거나 한쪽만 체결된 가짜 헤지일 수 있습니다.
    상단 [헤지 깨진 거래 제외] 탭에서 순수 전략 성과를 확인하세요.</div>`;
}

function setVariant(v) {
  current = v;
  document.getElementById('btn-all').classList.toggle('active', v === 'all');
  document.getElementById('btn-clean').classList.toggle('active', v === 'clean');
  const payload = DATA.variants[v];
  renderCards(payload.totals);
  renderTable(payload.weekly);
  renderChart(payload.weekly);
}

document.getElementById('sub').textContent =
  `기간: ${DATA.period.start} ~ ${DATA.period.end} (KST)  ·  생성: ${DATA.generated}`;
document.getElementById('foot').textContent = 'Netbitrage · 무위험 차익거래 실시간 포워드 백테스트 리포트';
renderBroken();
setVariant('all');
</script>
</body>
</html>
